<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<text x="500" y="36" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">Architecture of the agent</text>
<rect x="20" y="80" width="200" height="70" rx="12" fill="#f1f3f5" stroke="#7b8794" stroke-width="2"/>
<text x="120.0" y="109.83333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">LinkedIn export</text>
<text x="120.0" y="128.83333333333331" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">Profile, Shares, Comments</text>
<rect x="20" y="170" width="200" height="70" rx="12" fill="#f1f3f5" stroke="#7b8794" stroke-width="2"/>
<text x="120.0" y="199.83333333333334" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Your own text files</text>
<text x="120.0" y="218.83333333333334" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">posts, notes, drafts</text>
<rect x="20" y="260" width="200" height="70" rx="12" fill="#f1f3f5" stroke="#7b8794" stroke-width="2"/>
<text x="120.0" y="289.8333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Hacker News and RSS</text>
<text x="120.0" y="308.8333333333333" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">live trend sources</text>
<rect x="290" y="80" width="200" height="70" rx="12" fill="#e3f0ff" stroke="#2f6fba" stroke-width="2"/>
<text x="390.0" y="109.83333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Style learner</text>
<text x="390.0" y="128.83333333333331" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">profile + embeddings</text>
<rect x="290" y="260" width="200" height="70" rx="12" fill="#e3f0ff" stroke="#2f6fba" stroke-width="2"/>
<text x="390.0" y="289.8333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Researcher</text>
<text x="390.0" y="308.8333333333333" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">tool calling loop</text>
<rect x="290" y="380" width="200" height="70" rx="12" fill="#f1f3f5" stroke="#7b8794" stroke-width="2"/>
<text x="390.0" y="409.8333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Tools</text>
<text x="390.0" y="428.8333333333333" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">HN, RSS, past topics</text>
<rect x="560" y="140" width="200" height="70" rx="12" fill="#e5f6e8" stroke="#2f855a" stroke-width="2"/>
<text x="660.0" y="169.83333333333334" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Post writer</text>
<text x="660.0" y="188.83333333333334" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">write, check, revise</text>
<rect x="560" y="260" width="200" height="70" rx="12" fill="#e5f6e8" stroke="#2f855a" stroke-width="2"/>
<text x="660.0" y="289.8333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Comment writer</text>
<text x="660.0" y="308.8333333333333" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">three options</text>
<rect x="830" y="200" width="150" height="90" rx="12" fill="#fde8ec" stroke="#c0392b" stroke-width="2"/>
<text x="905.0" y="230.33333333333334" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Approval queue</text>
<text x="905.0" y="249.33333333333334" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">you approve</text>
<text x="905.0" y="268.33333333333337" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">or edit</text>
<rect x="560" y="400" width="420" height="70" rx="12" fill="#efe9fb" stroke="#6b46c1" stroke-width="2"/>
<text x="770.0" y="429.8333333333333" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Memory (JSON files you can read)</text>
<text x="770.0" y="448.8333333333333" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">style, corpus, drafts, feedback, metrics, lessons</text>
<line x1="220" y1="115" x2="290" y2="115" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="220" y1="205" x2="290" y2="130" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="220" y1="295" x2="290" y2="295" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="390" y1="380" x2="390" y2="330" stroke="#52606d" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="490" y1="295" x2="560" y2="190" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="490" y1="115" x2="560" y2="175" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="490" y1="125" x2="560" y2="290" stroke="#52606d" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="760" y1="175" x2="830" y2="225" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="760" y1="295" x2="830" y2="265" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="905" y1="290" x2="905" y2="400" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<text x="909.0" y="345.0" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">results, edits</text>
<text x="500" y="500" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Dashed arrows are reads from memory or tools. Solid arrows move data forward.</text>
</svg>
