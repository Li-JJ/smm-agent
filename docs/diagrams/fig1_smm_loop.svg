<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<text x="450" y="38" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">The social media manager loop</text>
<rect x="40" y="70" width="360" height="150" rx="12" fill="#e3f0ff" stroke="#2f6fba" stroke-width="2"/>
<text x="220.0" y="119.66666666666667" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Research</text>
<text x="220.0" y="139.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Human: reads feeds, follows peers,</text>
<text x="220.0" y="159.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">keeps a list of ideas</text>
<text x="220.0" y="179.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Agent: fetches sources, ranks topics</text>
<rect x="500" y="70" width="360" height="150" rx="12" fill="#e5f6e8" stroke="#2f855a" stroke-width="2"/>
<text x="680.0" y="119.66666666666667" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Create</text>
<text x="680.0" y="139.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Human: drafts, edits, matches voice</text>
<text x="680.0" y="159.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Agent: drafts from examples,</text>
<text x="680.0" y="179.66666666666669" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">checks length and banned words</text>
<rect x="500" y="300" width="360" height="150" rx="12" fill="#fff4d6" stroke="#b7791f" stroke-width="2"/>
<text x="680.0" y="349.6666666666667" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Engage</text>
<text x="680.0" y="369.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Human: comments, replies, builds ties</text>
<text x="680.0" y="389.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Agent: drafts comment options,</text>
<text x="680.0" y="409.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">human sends and replies</text>
<rect x="40" y="300" width="360" height="150" rx="12" fill="#efe9fb" stroke="#6b46c1" stroke-width="2"/>
<text x="220.0" y="349.6666666666667" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Measure</text>
<text x="220.0" y="369.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Human: reads analytics, spots patterns</text>
<text x="220.0" y="389.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">Agent: logs results, summarizes</text>
<text x="220.0" y="409.6666666666667" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">what worked, writes lessons</text>
<line x1="400" y1="145" x2="500" y2="145" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="680" y1="220" x2="680" y2="300" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="500" y1="375" x2="400" y2="375" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="220" y1="300" x2="220" y2="220" stroke="#52606d" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="252" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">repeat weekly</text>
</svg>
